name: Crypto Signal Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Fix DNS for Nobitex
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create directories
        run: |
          mkdir -p logs
          mkdir -p src/data
          mkdir -p src/data/logs

      - name: Run Crypto Signal Bot
        env:
          NOBITEX_API_KEY: ${{ secrets.NOBITEX_API_KEY }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL || 'gpt-3.5-turbo' }}
          TEST_MODE: false
          LOG_LEVEL: INFO
        run: |
          python run.py --once

      # ================================================
      # 🔥 مرحله جدید: ذخیره وضعیت در ریپو
      # ================================================
      - name: Commit updated state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # اضافه کردن فایل‌های وضعیت
          git add state.json || true
          git add src/data/portfolio_state.json || true
          git add src/data/trades_history.json || true
          
          # کامیت کردن اگه تغییری وجود داشته باشه
          git diff --staged --quiet || git commit -m "update trade state [skip ci]"
          
          # push به ریپو
          git push

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            logs/
            state.json
            src/data/
          if-no-files-found: ignore
