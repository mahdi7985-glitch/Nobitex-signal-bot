name: Crypto Signal Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Create directories
      run: |
        mkdir -p data/logs data/cache data/history data/signals
    
    - name: Run Crypto Signal Bot
      env:
        NOBITEX_API_KEY: ${{ secrets.NOBITEX_API_KEY }}
        BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
        BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        AI_API_KEY: ${{ secrets.AI_API_KEY }}
        AI_MODEL: ${{ secrets.AI_MODEL || 'gpt-3.5-turbo' }}
        TEST_MODE: ${{ secrets.TEST_MODE || 'false' }}
        LOG_LEVEL: ${{ secrets.LOG_LEVEL || 'INFO' }}
      run: |
        python run.py --once
    
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: logs
        path: data/logs/
